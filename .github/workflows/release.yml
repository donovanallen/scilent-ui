name: Release

on:
  push:
    branches:
      - main
    # Trusted publishing: npm validates (repository, workflow filename) against
    # the trusted-publisher config on npmjs.com. The workflow filename must be
    # exactly `.github/workflows/release.yml` — renaming breaks publishes.
  workflow_dispatch: # manual re-run for release retries (repo -> Actions -> Release)

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write # Needed for npm provenance

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          # This makes Actions fetch all Git history so that Changesets can generate changelogs with the correct commits
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 23

      # npm >= 11.5.1 required for trusted publishing (OIDC);
      # Node 23 ships npm 10.x, so install an LTS-compatible npm explicitly.
      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Build
        run: pnpm build

      - name: Create Release PR or Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          # This expects you to have a script called release which does a build for your packages
          # (action v2 renamed inputs: publish→publish-script, version→version-script,
          #  commit→commit-message, title→pr-title)
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: 'chore: update versions'
          pr-title: 'chore: update versions'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Trusted publishing (action v2): NO NPM_TOKEN/NODE_AUTH_TOKEN — passing
          # either makes the action write a token .npmrc and npm skips its OIDC
          # exchange (the E404/ENEEDAUTH failures we hit on action v1).
          NPM_CONFIG_PROVENANCE: true

      - name: Create Git Tag
        if: steps.changesets.outputs.published == 'true'
        run: |
          # Extract version from the first published package
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[0].version')
          git tag v$VERSION
          git push origin v$VERSION
